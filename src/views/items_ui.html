<!DOCTYPE html>
<html lang="es">
<head>
 <meta charset="UTF-8">
 <title>Items UI</title>
 <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
    label { display: block; margin-top: 15px; font-weight: bold; }
    input { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ddd; border-radius: 4px; }
    select { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ddd; border-radius: 4px; }
    button { margin-top: 20px; padding: 10px 20px; background: #87ADFD; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #AAE4FE; }
    .btn-edit { background-color: #ffc107; color: black; padding: 4px 8px; margin-right: 5px; font-size: 0.8em; }
    .btn-delete { background-color: #dc3545; color: white; padding: 4px 8px; font-size: 0.8em; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background-color: #f2f2f2; }
    tr:nth-child(even) { background-color: #f9f9f9; }
    tr:hover { background-color: #f5f5f5; }
    .filter-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
 </style>
</head>
<body>
 <h1>Gestión de Items</h1>
 
 <div style="margin-bottom: 20px;">
    <a href="categories" style="display: inline-block; padding: 10px 20px; background: #6c757d; color: white; text-decoration: none; border-radius: 4px; cursor: pointer;">Gestionar Categorías</a>
 </div>
 
 <div id="errors" style="display:none; color:red;"></div>
 
 <form id="search-form" style="margin-bottom: 20px;">
    <div class="filter-row">
        <label>Buscar por nombre:
            <input type="text" name="q" placeholder="Texto que debe contener el nombre">
        </label>
        <label>Filtrar por categoría:
            <select id="category-filter">
                <option value="">- Sin filtro -</option>
            </select>
        </label>
    </div>
    <button type="submit">Buscar</button>
 </form>
 
 <div id="status" style="display:none; margin-bottom: 15px; color:#333; font-weight:bold;"></div>
 <div id="items-list"></div>
 
 <h2 id="form-title" style="margin-top: 40px;">Crear Nuevo Item</h2>
 <form id="create-form">
 <label>Nombre del Item:
    <input type="text" name="name" required>
</label>

<label>Cantidad:
    <input type="number" name="qty" min="1" required>
</label>
 <label>Precio:
    <input type="number" name="price" min="0.01" max="99999999.99" step="0.01" required>
</label>
 <label>Categoría:
    <select name="category_id" id="item-category">
        <option value="">-- Selecciona una categoría --</option>
    </select>
</label>
 <button type="submit">Crear Item</button>
 </form>

 <script>
    let editingItemId = null;

    // Cargar categorías en los combos
    async function loadCategories() {
        try {
            const response = await fetch('api/categories');
            const data = await response.json();
            const filterSelect = document.getElementById('category-filter');
            const itemSelect = document.getElementById('item-category');
            
            if (data.ok && data.categories) {
                data.categories.forEach(cat => {
                    // Opción para el filtro
                    const filterOption = document.createElement('option');
                    filterOption.value = cat.id;
                    filterOption.textContent = cat.name;
                    filterSelect.appendChild(filterOption);
                    
                    // Opción para el formulario de items
                    const itemOption = document.createElement('option');
                    itemOption.value = cat.id;
                    itemOption.textContent = cat.name;
                    itemSelect.appendChild(itemOption);
                });
            }
            
            // Verificar si hay un parámetro category_id en la URL para pre-seleccionar el filtro
            const urlParams = new URLSearchParams(window.location.search);
            const categoryIdParam = urlParams.get('category_id');
            if (categoryIdParam) {
                filterSelect.value = categoryIdParam;
            }
        } catch (error) {
            console.error('Error al cargar las categorías:', error);
        }
    }

    // Función para cargar la lista de items
    async function loadItems(query = '', categoryId = '') {
        const statusDiv = document.getElementById('status');
        statusDiv.textContent = 'Buscando items...';
        statusDiv.style.display = 'block';
        //Esperar 2 segundos paara visualizar el mensaje de búsqueda
        await new Promise(resolve => setTimeout(resolve, 2000));

        try {
            let url = 'api/items';
            const params = [];
            if (query) params.push(`q=${encodeURIComponent(query.toLowerCase())}`);
            if (categoryId) params.push(`category_id=${encodeURIComponent(categoryId)}`);
            if (params.length > 0) url += '?' + params.join('&');
            
            const response = await fetch(url);

            console.log('Respuesta del servidor:', response);
            const data = await response.json();
            console.log('Items cargados:', data);
            if(data.ok) {
                renderItems(data.items);
            } else {
                showErrors([data.error || 'Error al cargar los items']);
            }
        } catch (error) {
            console.error('Error al cargar los items:', error);
            showErrors([error.message]);
        } finally {
            statusDiv.style.display = 'none';
        }
    }

    function renderItems(items) {
        const container = document.getElementById('items-list');
    
        if (items.length === 0) {
            container.innerHTML = '<p>No se encontraron items para la búsqueda</p>';
            return;
        }
        
        let html = '<table>';
        html += '<thead>';
        html += '<tr>';
        html += '<th>ID</th>';
        html += '<th>Nombre</th>';
        html += '<th>Cantidad</th>';
        html += '<th>Precio</th>';
        html += '<th>Acciones</th>';
        html += '</tr>';
        html += '</thead>';
        html += '<tbody>';
        
        items.forEach(item => {
            const escapedName = item.name.replace(/'/g, "\\'");
            html += '<tr>';
            html += `<td>${item.id}</td>`;
            html += `<td>${item.name}</td>`;
            html += `<td>${item.qty}</td>`;
            html += `<td>${item.price}</td>`;
            html += `<td>
                <button class="btn-edit" onclick="prepareEdit(${item.id}, '${escapedName}', ${item.qty}, ${item.price}, '${item.category_id || ''}')">Editar</button>
                <button class="btn-delete" onclick="deleteItem(${item.id})">Eliminar</button>
            </td>`;
            html += '</tr>';
        });
        
        html += '</tbody>';
        html += '</table>';
        
        container.innerHTML = html;
    };

    // Función para cargar datos en el formulario y entrar en modo edición
    window.prepareEdit = function(id, name, qty, price, categoryId = '') {
        editingItemId = id;
        document.getElementById('form-title').textContent = 'Editar Item #' + id;
        const form = document.getElementById('create-form');
        form.querySelector('[name="name"]').value = name;
        form.querySelector('[name="qty"]').value = qty;
        form.querySelector('[name="price"]').value = price;
        form.querySelector('[name="category_id"]').value = categoryId || '';
        form.querySelector('button[type="submit"]').textContent = 'Actualizar Item';
        
        if (!document.getElementById('btn-cancel')) {
            const cancelBtn = document.createElement('button');
            cancelBtn.id = 'btn-cancel';
            cancelBtn.type = 'button';
            cancelBtn.textContent = 'Cancelar';
            cancelBtn.style.marginLeft = '10px';
            cancelBtn.style.backgroundColor = '#6c757d';
            cancelBtn.onclick = resetForm;
            form.appendChild(cancelBtn);
        }
        form.scrollIntoView({ behavior: 'smooth' });
    };

    window.resetForm = function() {
        editingItemId = null;
        document.getElementById('form-title').textContent = 'Crear Nuevo Item';
        const form = document.getElementById('create-form');
        form.reset();
        form.querySelector('button[type="submit"]').textContent = 'Crear Item';
        const cancelBtn = document.getElementById('btn-cancel');
        if (cancelBtn) cancelBtn.remove();
    };

    window.deleteItem = async function(id) {
        if (!confirm('¿Está seguro de que desea eliminar este item?')) return;
        try {
            const response = await fetch(`api/items/${id}`, { method: 'DELETE' });
            const data = await response.json();
            if (data.ok) { loadItems(); } else { showErrors([data.error]); }
        } catch (error) { showErrors([error.message]); }
    };

    document.getElementById('search-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        document.getElementById('errors').style.display = 'none';

        const query = new FormData(e.target).get('q') || '';
        const categoryId = document.getElementById('category-filter').value || '';
        loadItems(query.trim(), categoryId);
    });

    // Evento para cambiar el filtro de categoría
    document.getElementById('category-filter').addEventListener('change', () => {
        document.getElementById('search-form').dispatchEvent(new Event('submit'));
    });

    // Manejar el envío del formulario (POST para crear, PUT para editar)
    document.getElementById('create-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        // Ocultar errores anteriores
        document.getElementById('errors').style.display = 'none';

        const formData = new FormData(e.target);
        const data = {
            name: formData.get('name'),
            qty: parseInt(formData.get('qty'), 10),
            price: parseFloat(formData.get('price')),
            category_id: formData.get('category_id') || null
        };

        const url = editingItemId ? `api/items/${editingItemId}` : 'api/items';
        const method = editingItemId ? 'PUT' : 'POST';

        try {
            const response = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const responseData = await response.json();
            
            if (response.ok && responseData.ok) {
                resetForm();
                loadItems();
            } else {
                showErrors(responseData.errors || ['Error al crear el item']);
                return;
            }
        } catch (error) {
            showErrors([error.message]);
        }
    });

    // Función para mostrar errores
    function showErrors(errors) {
        // Asegurar que errors sea un array de strings
        if (!Array.isArray(errors)) {
            if (typeof errors === 'object' && errors !== null) {
                // Si es un objeto, extraer los valores (mensajes de error)
                errors = Object.values(errors);
            } else {
                errors = [String(errors)];
            }
        }
        
        const errorsDiv = document.getElementById('errors');
        console.error('Errores:', errors);
        errorsDiv.innerHTML = errors.map(err => `<p>${err}</p>`).join('');
        errorsDiv.style.display = 'block';
    }

    // Cargar las categorías al inicializar la página
    loadCategories();
    
    // Cargar items con los parámetros de la URL si existen
    const urlParams = new URLSearchParams(window.location.search);
    const categoryIdParam = urlParams.get('category_id') || '';
    loadItems('', categoryIdParam);
 </script>
</body>
</html>
