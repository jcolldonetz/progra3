<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Categorías</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h1>Categorías</h1>
        <div>
            <a href="items" class="btn btn-outline-secondary">Gestionar Ítems</a>
            <button class="btn btn-primary" onclick="showCreateModal()">Nueva Categoría</button>
        </div>
    </div>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody id="categories-table"></tbody>
    </table>

    <!-- Modal para Formulario -->
    <div class="modal fade" id="categoryModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="category-form">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modal-title">Categoría</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <input type="hidden" id="cat-id">
                        <div class="mb-3">
                            <label class="form-label">Nombre</label>
                            <input type="text" id="cat-name" class="form-control" required maxlength="50">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea id="cat-description" class="form-control" maxlength="255"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="submit" class="btn btn-success">Guardar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const modal = new bootstrap.Modal(document.getElementById('categoryModal'));
        const tableBody = document.getElementById('categories-table');
        const form = document.getElementById('category-form');

        async function loadCategories() {
            const res = await fetch('api/categories');
            const data = await res.json();
            tableBody.innerHTML = '';
            data.categories.forEach(cat => {
                tableBody.innerHTML += `
                    <tr>
                        <td>${cat.id}</td>
                        <td>${cat.name}</td>
                        <td>${cat.description || '-'}</td>
                        <td>
                            <button class="btn btn-sm btn-info text-white" onclick="viewItems(${cat.id}, '${cat.name}')">Ver Ítems</button>
                            <button class="btn btn-sm btn-warning" onclick="editCategory(${JSON.stringify(cat).replace(/"/g, '&quot;')})">Editar</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteCategory(${cat.id})">Borrar</button>
                        </td>
                    </tr>`;
            });
        }

        function showCreateModal() {
            form.reset();
            document.getElementById('cat-id').value = '';
            document.getElementById('modal-title').innerText = 'Nueva Categoría';
            modal.show();
        }

        function editCategory(cat) {
            document.getElementById('cat-id').value = cat.id;
            document.getElementById('cat-name').value = cat.name;
            document.getElementById('cat-description').value = cat.description;
            document.getElementById('modal-title').innerText = 'Editar Categoría';
            modal.show();
        }

        form.onsubmit = async (e) => {
            e.preventDefault();
            const id = document.getElementById('cat-id').value;
            const data = {
                name: document.getElementById('cat-name').value,
                description: document.getElementById('cat-description').value
            };
            
            const url = id ? `api/categories/${id}` : 'api/categories';
            const method = id ? 'PUT' : 'POST';
console.log('Enviando datos:', { url, method, data });
            const res = await fetch(url, {
                method: method,
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });

            if (res.ok) {
                modal.hide();
                loadCategories();
            } else {
                const err = await res.json();
                alert('Error: ' + JSON.stringify(err.errors || err.error));
            }
        };

        async function deleteCategory(id) {
            if (!confirm('¿Está seguro?')) return;
            const res = await fetch(`api/categories/${id}`, { method: 'DELETE' });
            if (res.ok) loadCategories();
            else {
                const err = await res.json();
                alert(err.error);
            }
        }

        function viewItems(id, name) {
            // Redirigir a la vista de items con el filtro de categoría aplicado
            window.location.href = `items?category_id=${id}`;
        }

        loadCategories();
    </script>
</body>
</html>
